services:

  # ─── Python FastAPI ─────────────────────────────────────────
  python-api:
    container_name: internal-audit-python
    build:
      context: ./apps/backend/python
      dockerfile: Dockerfile

    env_file:
      - ./apps/backend/.env

    environment:
      PYTHON_SERVICE_PORT: 8001
      ORACLE_CLIENT_LIB: /opt/oracle/instantclient_21_13
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}

    ports:
      - "8001:8001"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped


  # ─── Backend ────────────────────────────────────────────────
  backend:
    container_name: internal-audit-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        HTTP_PROXY: http://103.51.60.125:3128
        HTTPS_PROXY: http://103.51.60.125:3128

    env_file:
      - ./apps/backend/.env

    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${FRONTEND_URL}

      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE}

      PYTHON_SERVICE_URL: http://python-api:8001
      PYTHON_API_KEY: ${PYTHON_API_KEY}

      HTTP_PROXY: http://103.51.60.125:3128
      HTTPS_PROXY: http://103.51.60.125:3128
    volumes:
      - ./apps/backend/data/oracle:/data/oracle
    ports:
      - "3001:3001"

    depends_on:
      python-api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped


  # ─── Frontend ───────────────────────────────────────────────
  frontend:
    container_name: internal-audit-frontend
    build:
      context: .
      dockerfile: apps/nextn/Dockerfile
      args:
        HTTP_PROXY: http://103.51.60.125:3128
        HTTPS_PROXY: http://103.51.60.125:3128

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}
      JWT_SECRET: ${JWT_SECRET}

      HTTP_PROXY: http://103.51.60.125:3128
      HTTPS_PROXY: http://103.51.60.125:3128

    ports:
      - "9002:9002"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:9002', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped