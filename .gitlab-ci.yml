stages:
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

# ── 1. BUILD: Docker image-уудыг build хийнэ ────────────────────────────────
build:
  stage: build
  tags:
    - local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "=== Building Docker images ==="
    - docker compose -f docker-compose.yml build --parallel
    - echo "=== Build complete ==="

# ── 2. DEPLOY: Шинэ container-уудаар солих ──────────────────────────────────
deploy:
  stage: deploy
  tags:
    - local
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: http://localhost:9002
  script:
    - echo "=== Deploying to local production ==="
    - docker compose -f docker-compose.yml up -d --remove-orphans
    - docker compose -f docker-compose.yml ps
    - echo "=== Deploy complete — http://localhost:9002 ==="
  needs:
    - build
