image: node:18

stages:
  - deploy

deploy_job:
  stage: deploy
  only:
    - main
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install -y openssh-client )'
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - scp $ENV_FILE $DEPLOY_USER@$DEPLOY_HOST:/opt/myproject/DaHUB-main/.env
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd /opt/myproject/DaHUB-main && git pull && docker compose up -d --build"
